name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: rvdown-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: rvdown-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: rvdown-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: rvdown-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (BoringSSL needs CMake)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          exe="rvdown"
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe="rvdown.exe"; fi
          src="target/${{ matrix.target }}/release/$exe"
          out="${{ matrix.name }}"
          mkdir -p dist
          cp "$src" "dist/$exe"
          cp README.md README.zh-CN.md LICENSE NOTICE "dist/"
          mkdir -p dist/docs && cp docs/*.md "dist/docs/"
          (cd dist && zip -r "../${out}.zip" .)
          sha256sum "${out}.zip" > "${out}.zip.sha256" 2>/dev/null || shasum -a 256 "${out}.zip" > "${out}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
